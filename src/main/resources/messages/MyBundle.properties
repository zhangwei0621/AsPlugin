# 在此集中定义界面文案，通过 MyBundle 获取。
# 窗口和左右编辑器的标题。
jsondiff.title=JsonDiff
jsondiff.left.title=原始 JSON
jsondiff.right.title=对比 JSON

# 工具栏选项及悬停提示，说明文字只在 tooltip 中展示。
jsondiff.autoformat=自动格式化
jsondiff.autoformat.tooltip=停止输入后自动格式化合法 JSON
jsondiff.sort.keys=对象键排序
jsondiff.sort.keys.tooltip=递归排序对象键，保留数组元素顺序

# 操作名称同时用于按钮提示和 IDE 撤销记录。
jsondiff.format=格式化两侧 JSON
jsondiff.swap=交换左右 JSON
jsondiff.clear=清空两侧 JSON

# 状态栏使用简短提示；details 的 {0} 由 UI 填入完整 JSON 错误路径。
jsondiff.status.empty=等待输入
jsondiff.status.valid=校验通过
jsondiff.status.invalid=格式错误
jsondiff.status.duplicate=存在重复键
jsondiff.status.invalid.details=JSON 格式错误（路径：{0}）
jsondiff.status.duplicate.details=JSON 包含重复键（路径：{0}）
jsondiff.status.pending=校验中…

# {0} 为行数，{1} 为 IDE 文档的 UTF-16 字符长度。
jsondiff.document.stats={0} 行 · {1} 字符
