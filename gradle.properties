# 插件元数据，构建时注入 plugin.xml。
pluginId = com.github.zhangwei0621.asplugin
pluginName = JsonDiffTool
version = 1.0.0
pluginVendor = zhangwei0621

# 最低兼容 Build 与编译平台。
pluginSinceBuild = 223
platformVersion = 2022.3.3

# 当前 AS 用于兼容性校验和 runAndroidStudio 调试。
verificationLocalPath = /Applications/Android Studio.app/Contents

# 使用 IDE 自带的 Kotlin 标准库，避免重复打包。
kotlin.stdlib.default.dependency = false

# Gradle 缓存。
org.gradle.configuration-cache = true
org.gradle.caching = true
