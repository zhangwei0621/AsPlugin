group = com.github.zhangwei0621.asplugin
version = 0.0.1

# 本地目标 Android Studio，可通过 -PplatformLocalPath 覆盖
platformLocalPath = /Applications/Android Studio.app/Contents

# 使用 IDE 提供的 Kotlin 标准库
kotlin.stdlib.default.dependency = false

# 启用 Gradle 配置缓存
org.gradle.configuration-cache = true

# 启用 Gradle 构建缓存
org.gradle.caching = true
